name: Refresh and publish Beebe
on:
  schedule:
    - cron: '23 9 * * *'
    - cron: '41 10 * * 2,5'
    - cron: '17 11 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      mode:
        description: Data to refresh (publish skips upstream requests)
        type: choice
        options: [fast, images, all, reconcile, publish]
        default: all
      max_downloads:
        description: Maximum cutout attempts this run
        type: number
        default: 100
# Do not race a fast refresh against an image refresh or deploy stale intermediate state.
concurrency:
  group: beebe-publish
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/fits
          key: beebe-fits-${{ runner.os }}-${{ github.run_id }}
          restore-keys: beebe-fits-${{ runner.os }}-
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Refresh selected sources
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DOWNLOADS: ${{ inputs.max_downloads }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode="${REQUESTED_MODE:-fast}"
          if [ "$SCHEDULE" = '41 10 * * 2,5' ]; then mode=images; fi
          if [ "$SCHEDULE" = '17 11 1 1,4,7,10 *' ]; then mode=reconcile; fi
          limit="${REQUESTED_DOWNLOADS:-100}"
          if [ "$mode" = reconcile ]; then
            python -m pipeline.cli refresh --mode images --reconcile --max-downloads "$limit" --budget-seconds 1200
          elif [ "$mode" != publish ]; then
            python -m pipeline.cli refresh --mode "$mode" --max-downloads "$limit" --budget-seconds 1200
          fi
      - run: npm run typecheck && npm run lint && npm run test:unit
      - run: python -m pytest tests -q && python -m pipeline.cli validate
      - name: Set Pages base path
        env:
          # Optional repository variable; set to /repository-name for project Pages.
          # Leave empty for a custom domain or owner.github.io repository.
          CONFIGURED_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          echo "BASE_PATH=$CONFIGURED_BASE_PATH" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$CONFIGURED_BASE_PATH" >> "$GITHUB_ENV"
      - run: npm run build
      - run: python scripts/check_static.py
      - name: Commit validated data and assets
        run: |
          git config user.name 'Beebe archive bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public/media
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Beebe records and public image archive"
            git push origin HEAD:main
          fi
      # Deploy here: pushes by GITHUB_TOKEN do not trigger a separate push workflow.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/client
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Write operator summary
        if: always()
        run: python scripts/run_summary.py >> "$GITHUB_STEP_SUMMARY"
